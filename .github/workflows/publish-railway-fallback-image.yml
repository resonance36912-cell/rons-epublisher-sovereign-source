name: Publish Railway fallback image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-railway-fallback-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: epublisher-railway-fallback-image
  cancel-in-progress: false

env:
  SOURCE_SHA: 5827b0b89abc8e5f13aa29593075edddbf80a9ae
  IMAGE: ghcr.io/resonance36912-cell/rons-epublisher-sovereign-source

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact governed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/resonance36912-cell/rons-epublisher-sovereign-source
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Verify anonymous pull
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker image rm "${IMAGE}:${SOURCE_SHA}" >/dev/null 2>&1 || true
          docker pull "${IMAGE}:${SOURCE_SHA}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${SOURCE_SHA}")"
          test -n "${DIGEST}"
          echo "Anonymous GHCR pull verified: ${DIGEST}"
